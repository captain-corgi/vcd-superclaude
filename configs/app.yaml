app:
  name: "multi-agent-system"
  version: "1.0.0"
  debug: true
  port: 8080
  timeout: 30s

agents:
  planner:
    enabled: true
    max_requests: 10
    timeout: 30s

  executor:
    enabled: true
    rate_limit: 100
    retry_count: 3
    tools:
      - jira
      - slack
      - github

  evaluator:
    enabled: true
    cache_ttl: 1h
    max_report_size: 10MB
    validation_rules:
      - name: "data_completeness"
        type: "completeness"
        criteria:
          min_completeness: 0.8
        required: true

communication:
  a2a:
    protocol: "trpc"
    timeout: 10s
    retries: 3
    service_token: "${COMMUNICATION_A2A_SERVICE_TOKEN}"

  streaming:
    enabled: true
    buffer_size: 1000

tools:
  jira:
    base_url: "${JIRA_BASE_URL}"
    rate_limit:
      requests_per_minute: 100
    cache:
      ttl: 5m

  slack:
    rate_limit:
      tier: "tier3"
    pagination:
      limit: 200

  github:
    rate_limit:
      requests_per_hour: 5000
      remaining_threshold: 100
    cache:
      ttl: 10m

database:
  url: "${DATABASE_URL}"
  redis_url: "${REDIS_URL}"
  max_open_conns: 25
  max_idle_conns: 5
  conn_max_lifetime: 5m

logging:
  level: "info"
  format: "json" # json | console
  output: ["stdout"] # stdout, file
  file: "" # e.g., logs/app.log
  development: true
  datadog:
    enabled: false
    inject_apm: true
    service: "" # override service name (defaults to app.name)
    env: "" # override environment (defaults to DD_ENV)
    version: "" # override version (defaults to DD_VERSION)

audit:
  enabled: true
  expose_endpoints: true
  categories:
    http: true
    agent: true
    external: true
  retention_days: 90
  redact:
    deny_keys: ["password", "token", "authorization", "cookie", "email"]
  file_sink:
    enabled: false
    path: logs/audit.log
    max_size_mb: 100
    max_backups: 5
    max_age_days: 30
    compress: true

auth:
  providers:
    google:
      client_id: "${GOOGLE_CLIENT_ID}"
      client_secret: "${GOOGLE_CLIENT_SECRET}"
      redirect_base_url: "http://localhost:8080"
      allowed_domains: [] # e.g., ["yourcompany.com"]
  session:
    cookie_name: "mas_session"
    domain: ""
    secure: false
    ttl: 24h
    samesite: "lax"
  csrf:
    secret: "${AUTH_CSRF_SECRET:-your-csrf-secret-key}"
    cookie_name: "csrf_token"
    cookie_samesite: "lax"
    token_length: 32
    token_ttl: 1h
  bootstrap_admin_emails: [] # e.g., ["admin@yourcompany.com"]
